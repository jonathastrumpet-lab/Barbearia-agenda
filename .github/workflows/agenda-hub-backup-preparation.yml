name: Agenda Hub - backup seguro (preparacao)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: read
  id-token: write
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verificar configuracao obrigatoria
        env:
          DB: ${{ secrets.AGENDA_BACKUP_DATABASE_URL }}
          KEY: ${{ secrets.AGENDA_BACKUP_ENCRYPTION_KEY }}
        run: |
          test -n "$DB" || { echo "::error::Falta AGENDA_BACKUP_DATABASE_URL"; exit 1; }
          test -n "$KEY" || { echo "::error::Falta AGENDA_BACKUP_ENCRYPTION_KEY"; exit 1; }
          test "${#KEY}" -ge 32 || { echo "::error::Chave de criptografia deve ter pelo menos 32 caracteres"; exit 1; }
      - name: Instalar cliente PostgreSQL 18
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
      - name: Exportar banco e criptografar sem salvar dados em logs
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.AGENDA_BACKUP_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.AGENDA_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f backup.sql backup.sql.gz backup.sql.gz.tmp backup.sql.gz.enc' EXIT
          export PGCONNECT_TIMEOUT=20
          error_file="$(mktemp)"
          trap 'rm -f backup.sql backup.sql.gz backup.sql.gz.tmp backup.sql.gz.enc "$error_file"' EXIT
          if ! /usr/lib/postgresql/18/bin/pg_dump --dbname="$DATABASE_URL" --no-owner --no-acl --format=plain --schema=public --file=backup.sql 2>"$error_file"; then
            if grep -Eiq 'server version:|server version mismatch|aborting because of server version mismatch' "$error_file"; then
              echo "::error::VERSAO: cliente pg_dump mais antigo que o servidor. Atualize o pg_dump."
            elif grep -Eiq 'password authentication failed|invalid password' "$error_file"; then
              echo "::error::AUTENTICACAO: usuario ou senha nao aceitos."
            elif grep -Eiq 'could not translate host name|Name or service not known' "$error_file"; then
              echo "::error::DNS: endereco do banco nao encontrado."
            elif grep -Eiq 'connection refused|timeout expired|timed out|Network is unreachable|No route to host' "$error_file"; then
              echo "::error::REDE: conexao ao banco indisponivel."
            elif grep -Eiq 'permission denied|must be owner|insufficient privilege' "$error_file"; then
              echo "::error::PERMISSAO: usuario sem acesso para exportar algum objeto."
            elif grep -Eiq 'no matching schemas|schema.*does not exist' "$error_file"; then
              echo "::error::SCHEMA: public nao encontrado."
            else
              echo "::error::PG_DUMP: falha de exportacao nao classificada; nenhum detalhe sensivel foi exibido."
            fi
            exit 1
          fi
          test -s backup.sql
          gzip -9 backup.sql
          mv backup.sql.gz backup.sql.gz.tmp
          mv backup.sql.gz.tmp backup.sql.gz
          test -s backup.sql.gz
          export BACKUP_KEY
          openssl enc -aes-256-cbc -pbkdf2 -salt -iter 200000 -in backup.sql.gz -out backup.sql.gz.enc -pass env:BACKUP_KEY
          test -s backup.sql.gz.enc
          rm -f backup.sql.gz
          mkdir -p secure-output
          mv backup.sql.gz.enc "secure-output/agenda-hub-$(date -u +%Y%m%dT%H%M%SZ).sql.gz.enc"
      - name: Armazenar copia criptografada temporaria
        uses: actions/upload-artifact@v4
        with:
          name: agenda-hub-backup-encrypted
          path: secure-output/*.enc
          retention-days: 7
          if-no-files-found: error

      - name: Autenticar no Google Cloud sem chave privada
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/887784398222/locations/global/workloadIdentityPools/agenda-hub-github/providers/github
          service_account: agenda-hub-backup@agenda-hub-backup.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.file
      - name: Enviar backup criptografado ao Google Drive
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          FOLDER_ID: 18MxCp3f52drMtmcZkC8ocnHnlCkYJA2m
        run: |
          set -euo pipefail
          file="$(find secure-output -maxdepth 1 -type f -name '*.enc' -print -quit)"
          test -n "$file" && test -s "$file"
          filename="$(basename "$file")"
          metadata="$(printf '{"name":"%s","parents":["%s"]}' "$filename" "$FOLDER_ID")"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --request POST \
            --header "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" \
            --form "metadata=$metadata;type=application/json" \
            --form "file=@$file;type=application/octet-stream" \
            'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,parents')"
          if [ "$code" != "200" ]; then
            echo "::error::Falha ao enviar backup ao Drive (HTTP $code). Backup temporario no GitHub preservado."
            exit 1
          fi
          python3 - "$response" "$filename" "$FOLDER_ID" <<'PY'
          import json,sys,os
          data=json.load(open(sys.argv[1]))
          if data.get("name")!=sys.argv[2] or sys.argv[3] not in data.get("parents",[]) or int(data.get("size",0))<1:
              raise SystemExit("Upload nao confirmado")
          print("Backup criptografado enviado e confirmado no Google Drive.")
          PY
