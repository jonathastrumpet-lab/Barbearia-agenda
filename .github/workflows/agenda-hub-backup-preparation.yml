name: Agenda Hub - backup seguro (preparacao)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verificar configuracao obrigatoria
        env:
          DB: ${{ secrets.AGENDA_BACKUP_DATABASE_URL }}
          KEY: ${{ secrets.AGENDA_BACKUP_ENCRYPTION_KEY }}
        run: |
          test -n "$DB" || { echo "::error::Falta AGENDA_BACKUP_DATABASE_URL"; exit 1; }
          test -n "$KEY" || { echo "::error::Falta AGENDA_BACKUP_ENCRYPTION_KEY"; exit 1; }
          test "${#KEY}" -ge 32 || { echo "::error::Chave de criptografia deve ter pelo menos 32 caracteres"; exit 1; }
      - name: Instalar PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Exportar banco e criptografar sem salvar dados em logs
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.AGENDA_BACKUP_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.AGENDA_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f backup.sql.gz backup.sql.gz.enc' EXIT
          export PGCONNECT_TIMEOUT=20
          pg_dump --dbname="$DATABASE_URL" --no-owner --no-acl --format=plain --schema=public 2>/dev/null | gzip -9 > backup.sql.gz
          test -s backup.sql.gz
          export BACKUP_KEY
          openssl enc -aes-256-cbc -pbkdf2 -salt -iter 200000 -in backup.sql.gz -out backup.sql.gz.enc -pass env:BACKUP_KEY
          test -s backup.sql.gz.enc
          rm -f backup.sql.gz
          mkdir -p secure-output
          mv backup.sql.gz.enc "secure-output/agenda-hub-$(date -u +%Y%m%dT%H%M%SZ).sql.gz.enc"
      - name: Armazenar copia criptografada temporaria
        uses: actions/upload-artifact@v4
        with:
          name: agenda-hub-backup-encrypted
          path: secure-output/*.enc
          retention-days: 7
          if-no-files-found: error
