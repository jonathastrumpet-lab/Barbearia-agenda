name: Agenda Hub - backup criptografado (rascunho)
# Este workflow está em uma branch de revisão. Não entra em produção sem validação.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *' # 03:15 horario de Brasilia (UTC-3)

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validar segredos obrigatorios
        env:
          DB_URL: ${{ secrets.AGENDA_BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.AGENDA_BACKUP_PASSPHRASE }}
        run: |
          test -n "$DB_URL" || { echo "Falta AGENDA_BACKUP_DATABASE_URL"; exit 1; }
          test -n "$PASSPHRASE" || { echo "Falta AGENDA_BACKUP_PASSPHRASE"; exit 1; }
          test "${#PASSPHRASE}" -ge 24 || { echo "Senha de criptografia insuficiente"; exit 1; }
      - name: Instalar PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 || true
          if ! command -v pg_dump >/dev/null; then
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Exportar schemas auth e public e criptografar
        env:
          DB_URL: ${{ secrets.AGENDA_BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.AGENDA_BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backup
          export PGCONNECT_TIMEOUT=15
          pg_dump --dbname="$DB_URL" --format=custom --no-owner --no-acl --schema=auth --schema=public --file=backup/agenda.dump
          test -s backup/agenda.dump
          pg_restore --list backup/agenda.dump >/dev/null
          openssl enc -aes-256-cbc -pbkdf2 -salt -iter 200000 -in backup/agenda.dump -out backup/agenda.dump.enc -pass env:PASSPHRASE
          sha256sum backup/agenda.dump.enc > backup/agenda.dump.enc.sha256
          rm -f backup/agenda.dump
      - name: Guardar artefato criptografado por 30 dias
        uses: actions/upload-artifact@v4
        with:
          name: agenda-backup-${{ github.run_id }}
          path: |
            backup/agenda.dump.enc
            backup/agenda.dump.enc.sha256
          retention-days: 30
          if-no-files-found: error
