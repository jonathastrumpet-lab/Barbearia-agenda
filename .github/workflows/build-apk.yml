name: Build Android APK
# Build trigger: legacy client fallback validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Prepare Gradle wrapper if missing
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            rm -rf /tmp/flutter_wrapper
            flutter create --platforms=android --org com.barbeariaagenda /tmp/flutter_wrapper
            cp /tmp/flutter_wrapper/android/gradlew android/gradlew
            cp /tmp/flutter_wrapper/android/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp /tmp/flutter_wrapper/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi
      - name: Analyze project
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }} --dart-define=BARBERSHOP_ID=${{ vars.BARBERSHOP_ID }}
      - name: Upload app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
